<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QxChat</title>
  <style>
    :root { color-scheme: dark; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      background: #1b1b1d;
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      color: #f4f4f5;
      user-select: none;
    }
    .mark {
      width: 72px;
      height: 72px;
      border-radius: 18px;
      background: #2090ea;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 34px;
      font-weight: 800;
      color: #fff;
      box-shadow: 0 12px 32px rgba(32, 144, 234, 0.35);
    }
    .title { font-size: 20px; font-weight: 700; letter-spacing: -0.01em; }
    .subtitle { font-size: 13px; color: #8a8a90; }
    .spinner {
      width: 22px;
      height: 22px;
      border: 2px solid rgba(255,255,255,0.12);
      border-top-color: #2090ea;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="mark">Q</div>
  <div class="title">QxChat</div>
  <div class="subtitle">Starting…</div>
  <div class="spinner"></div>
</body>
</html>
